<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

const C = {
  paper: "#FFF6EE", paperDeep: "#FFE7D9", line: "#FFDCC2",
  ink: "#8A5A45", inkSoft: "#C08A6E", stamp: "#FF9270", moss: "#E8A33D",
};
const GRADIENT = "linear-gradient(135deg, #FF9270, #FFC9A8)";
const STAMP_COLORS = ["#FF9270", "#F76C6C", "#E8834A", "#FF8FA3", "#F4A261", "#D9765A"];

const fmtYen = (n) => `¥${Math.round(Number(n || 0)).toLocaleString("ja-JP")}`;
const todayISO = () => new Date().toISOString().slice(0, 10);
const pad2 = (n) => String(n).padStart(2, "0");
const monthKeyOf = (iso) => iso.slice(0, 7);
const fmtDateJp = (iso) => {
  const d = new Date(iso + "T00:00:00");
  return `${d.getMonth() + 1}月${d.getDate()}日`;
};
const fmtMonthJp = (mk) => {
  const [y, m] = mk.split("-").map(Number);
  return `${y}年${m}月`;
};
const shiftMonth = (mk, delta) => {
  let [y, m] = mk.split("-").map(Number);
  m += delta;
  while (m > 12) { m -= 12; y += 1; }
  while (m < 1) { m += 12; y -= 1; }
  return `${y}-${pad2(m)}`;
};
const daysInMonth = (y, m) => new Date(y, m, 0).getDate();

const Icon = ({ children, size = 16, color = C.inkSoft, style }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={style}>
    {children}
  </svg>
);
const BookIcon = (p) => <Icon {...p}><path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3V4z"/><path d="M18 4v16"/></Icon>;
const PlusIcon = (p) => <Icon {...p}><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></Icon>;
const TagIcon = (p) => <Icon {...p}><path d="M4 11V4h7l9 9-7 7-9-9z"/><circle cx="8" cy="8" r="1"/></Icon>;
const UsersIcon = (p) => <Icon {...p}><circle cx="8" cy="8" r="3"/><circle cx="16" cy="9" r="3"/><path d="M2 20c0-3.3 2.7-6 6-6s6 2.7 6 6M13 14c3 0 6 2.5 6 6"/></Icon>;
const XIcon = (p) => <Icon {...p}><path d="M6 6l12 12M18 6L6 18"/></Icon>;
const GripIcon = (p) => <Icon {...p}><path d="M8 6h.01M8 12h.01M8 18h.01M16 6h.01M16 12h.01M16 18h.01" strokeWidth="2.6"/></Icon>;
const TrashIcon = (p) => <Icon {...p}><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></Icon>;
const ChevLeft = (p) => <Icon {...p}><path d="M15 6l-6 6 6 6"/></Icon>;
const ChevRight = (p) => <Icon {...p}><path d="M9 6l6 6-6 6"/></Icon>;
const RepeatIcon = (p) => <Icon {...p}><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></Icon>;
const BackspaceIcon = (p) => <Icon {...p}><path d="M21 4H8l-6 8 6 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><path d="M14 10l-4 4M10 10l4 4"/></Icon>;
const CheckIcon = (p) => <Icon {...p}><path d="M20 6L9 17l-5-5"/></Icon>;
const PencilIcon = (p) => <Icon {...p}><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></Icon>;

function Stamp({ member, size = 32 }) {
  if (!member) return null;
  return (
    <div style={{
      width: size, height: size, borderRadius: "9999px", background: member.color,
      color: "#fff", display: "flex",
      alignItems: "center", justifyContent: "center", fontFamily: "'Zen Maru Gothic', sans-serif",
      fontWeight: 700, fontSize: size * 0.42,
      boxShadow: "0 2px 5px rgba(0,0,0,0.12)", flexShrink: 0,
    }} title={member.name}>{member.name.slice(0, 1)}</div>
  );
}

function computeTotal(tokens, current) {
  const cur = Number(current) || 0;
  if (tokens.length === 0) return cur;
  let result = tokens[0];
  for (let j = 1; j < tokens.length; j += 2) {
    const op = tokens[j];
    const num = (j + 1 < tokens.length) ? tokens[j + 1] : cur;
    result = op === "+" ? result + num : result - num;
  }
  return result;
}

function App() {
  const [db, setDb] = useState(null);
  const [loading, setLoading] = useState(true);
  const [members, setMembers] = useState([]);
  const [entries, setEntries] = useState([]);
  const [recurring, setRecurring] = useState([]);
  const [tags, setTags] = useState([]);
  const [settlements, setSettlements] = useState({});
  const [confirmPaid, setConfirmPaid] = useState(false);
  const [view, setView] = useState("home");
  const [error, setError] = useState("");
  const [viewMonth, setViewMonth] = useState(monthKeyOf(todayISO()));

  const [newName, setNewName] = useState("");
  const [newTag, setNewTag] = useState("");

  const [calcTokens, setCalcTokens] = useState([]);
  const [calcInput, setCalcInput] = useState("0");
  const [tag, setTag] = useState("");
  const [memo, setMemo] = useState("");
  const [date, setDate] = useState(todayISO());
  const [memberId, setMemberId] = useState(null);
  const [isRecurring, setIsRecurring] = useState(false);
  const [freq, setFreq] = useState("monthly");
  const [editEntryId, setEditEntryId] = useState(null);
  const [editAmount, setEditAmount] = useState("");
  const [editTag, setEditTag] = useState("");
  const [editDate, setEditDate] = useState("");
  const [editMemo, setEditMemo] = useState("");
  const [justSaved, setJustSaved] = useState(false);

  useEffect(() => {
    try {
      firebase.initializeApp(window.FIREBASE_CONFIG);
      setDb(firebase.firestore());
    } catch (err) {
      setError("Firebaseへの接続に失敗しました。");
      setLoading(false);
    }
  }, []);

  useEffect(() => {
    if (!db) return;
    let loadedCount = 0;
    let done = false;
    const markLoaded = () => { loadedCount++; if (loadedCount >= 5 && !done) { done = true; setLoading(false); } };
    const timeout = setTimeout(() => {
      if (!done) { done = true; setError("接続がタイムアウトしました。Firestoreの設定を確認してください。"); setLoading(false); }
    }, 10000);

    const unsubM = db.collection("members").onSnapshot((snap) => {
      setMembers(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); markLoaded();
    }, () => { setError("メンバーの取得に失敗しました。"); markLoaded(); });
    const unsubT = db.collection("tags").onSnapshot((snap) => {
      const list = snap.docs.map((d) => ({ id: d.id, name: d.data().name, order: d.data().order ?? 0 }));
      list.sort((a, b) => a.order - b.order);
      setTags(list); markLoaded();
    }, () => { setError("タグの取得に失敗しました。"); markLoaded(); });
    const unsubE = db.collection("entries").onSnapshot((snap) => {
      setEntries(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); markLoaded();
    }, () => { setError("記録の取得に失敗しました。"); markLoaded(); });
    const unsubR = db.collection("recurring").onSnapshot((snap) => {
      setRecurring(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); markLoaded();
    }, () => { setError("繰り返し設定の取得に失敗しました。"); markLoaded(); });
    const unsubS = db.collection("settlements").onSnapshot((snap) => {
      const obj = {};
      snap.docs.forEach((d) => { obj[d.id] = !!d.data().paid; });
      setSettlements(obj); markLoaded();
    }, () => { setError("支払い状況の取得に失敗しました。"); markLoaded(); });

    return () => { clearTimeout(timeout); unsubM(); unsubT(); unsubE(); unsubR(); unsubS(); };
  }, [db]);

  useEffect(() => { if (members.length && !memberId) setMemberId(members[0].id); }, [members]);
  useEffect(() => { if (tags.length && !tag) setTag(tags[0].name); }, [tags]);
  useEffect(() => { setConfirmPaid(false); }, [viewMonth]);
  useEffect(() => {
    if (!confirmPaid) return;
    const t = setTimeout(() => setConfirmPaid(false), 2500);
    return () => clearTimeout(t);
  }, [confirmPaid]);

  const isPaid = !!settlements[viewMonth];
  const handlePaidTap = async () => {
    if (!confirmPaid) { setConfirmPaid(true); return; }
    setConfirmPaid(false);
    try { await db.collection("settlements").doc(viewMonth).set({ paid: !isPaid }); }
    catch { setError("支払い状況の更新に失敗しました。"); }
  };

  const addMember = async () => {
    if (!newName.trim() || !db) return;
    const color = STAMP_COLORS[members.length % STAMP_COLORS.length];
    try { await db.collection("members").add({ name: newName.trim(), color }); setNewName(""); }
    catch { setError("メンバーの追加に失敗しました。"); }
  };
  const removeMember = async (id) => {
    try { await db.collection("members").doc(id).delete(); } catch { setError("削除に失敗しました。"); }
  };
  const addTag = async () => {
    const t = newTag.trim();
    if (!t || tags.some((x) => x.name === t) || !db) return;
    try { await db.collection("tags").add({ name: t, order: tags.length }); setNewTag(""); }
    catch { setError("タグの追加に失敗しました。"); }
  };
  const removeTag = async (id) => {
    try { await db.collection("tags").doc(id).delete(); }
    catch { setError("削除に失敗しました。"); }
  };
  const moveTag = async (index, dir) => {
    const target = index + dir;
    if (target < 0 || target >= tags.length || !db) return;
    const next = [...tags];
    [next[index], next[target]] = [next[target], next[index]];
    try {
      await Promise.all(next.map((t, i) => db.collection("tags").doc(t.id).update({ order: i })));
    } catch { setError("並び替えに失敗しました。"); }
  };

  // タグのドラッグ並び替え
  const [dragId, setDragId] = useState(null);
  const [dragOffset, setDragOffset] = useState(0);
  const [dragOrder, setDragOrder] = useState(null);
  const dragStartY = useRef(0);
  const dragOrigIndex = useRef(0);
  const ITEM_H = 42;

  const displayTags = dragOrder || tags;

  const handleDragStart = (t, index, clientY) => {
    dragStartY.current = clientY;
    dragOrigIndex.current = index;
    setDragId(t.id);
    setDragOffset(0);
    setDragOrder(tags);
  };
  const handleDragMove = (t, clientY) => {
    if (dragId !== t.id) return;
    const delta = clientY - dragStartY.current;
    setDragOffset(delta);
    const shift = Math.round(delta / ITEM_H);
    const newIndex = Math.min(tags.length - 1, Math.max(0, dragOrigIndex.current + shift));
    setDragOrder((prev) => {
      const cur = prev || tags;
      const fromIndex = cur.findIndex((x) => x.id === t.id);
      if (fromIndex === -1 || fromIndex === newIndex) return cur;
      const next = [...cur];
      const [item] = next.splice(fromIndex, 1);
      next.splice(newIndex, 0, item);
      return next;
    });
  };
  const handleDragEnd = async () => {
    const finalOrder = dragOrder;
    setDragId(null); setDragOffset(0); setDragOrder(null);
    if (!finalOrder || !db) return;
    try {
      await Promise.all(finalOrder.map((t2, idx) => db.collection("tags").doc(t2.id).update({ order: idx })));
    } catch { setError("並び替えに失敗しました。"); }
  };

  const resetCalc = () => { setCalcTokens([]); setCalcInput("0"); };
  const pressDigit = (d) => setCalcInput((cur) => (cur === "0" ? d : cur.length < 9 ? cur + d : cur));
  const pressBackspace = () => setCalcInput((cur) => (cur.length > 1 ? cur.slice(0, -1) : "0"));
  const pressOp = (op) => { setCalcTokens((t) => [...t, Number(calcInput) || 0, op]); setCalcInput("0"); };
  const pressEquals = () => { const r = computeTotal(calcTokens, calcInput); setCalcTokens([]); setCalcInput(String(r)); };
  const liveTotal = useMemo(() => computeTotal(calcTokens, calcInput), [calcTokens, calcInput]);
  const exprPreview = useMemo(() => {
    const parts = calcTokens.map((t, i) => (typeof t === "number" ? t.toLocaleString("ja-JP") : t));
    return [...parts, calcInput].join(" ");
  }, [calcTokens, calcInput]);

  const addEntry = async () => {
    const val = Math.round(liveTotal);
    if (!val || val <= 0 || !memberId || !tag || !db) return;
    try {
      if (isRecurring) {
        await db.collection("recurring").add({ amount: val, tag, memo: memo.trim(), memberId, anchorDate: date, frequency: freq });
      } else {
        await db.collection("entries").add({ amount: val, tag, memo: memo.trim(), date, memberId });
      }
      resetCalc(); setMemo(""); setIsRecurring(false);
      setJustSaved(true);
      setTimeout(() => setJustSaved(false), 900);
    } catch { setError("記録の保存に失敗しました。"); }
  };
  const removeEntry = async (e) => {
    try {
      if (e.isRecurring) await db.collection("recurring").doc(e.recurringId).delete();
      else await db.collection("entries").doc(e.id).delete();
    } catch { setError("削除に失敗しました。"); }
  };
  const startEditEntry = (e) => {
    setEditEntryId(e.id);
    setEditAmount(String(e.amount));
    setEditTag(e.tag);
    setEditDate(e.date);
    setEditMemo(e.memo || "");
  };
  const saveEditEntry = async (e) => {
    const val = Math.round(Number(editAmount)) || 0;
    if (val <= 0 || !editTag) return;
    setEditEntryId(null);
    try {
      if (e.isRecurring) {
        await db.collection("recurring").doc(e.recurringId).update({ amount: val, tag: editTag, anchorDate: editDate, memo: editMemo.trim() });
      } else {
        await db.collection("entries").doc(e.id).update({ amount: val, tag: editTag, date: editDate, memo: editMemo.trim() });
      }
    } catch { setError("記録の更新に失敗しました。"); }
  };

  // 指定した月について、実際の記録 + 繰り返しの仮想記録 を合成する
  const getMonthEntries = (mk) => {
    const [y, m] = mk.split("-").map(Number);
    const actual = entries.filter((e) => monthKeyOf(e.date) === mk);
    const virtual = [];
    recurring.forEach((r) => {
      if (!r.anchorDate) return;
      const [ay, am, ad] = r.anchorDate.split("-").map(Number);
      if (r.frequency === "monthly") {
        if (y > ay || (y === ay && m >= am)) {
          const day = Math.min(ad, daysInMonth(y, m));
          virtual.push({ id: `rec_${r.id}_${mk}`, amount: r.amount, tag: r.tag, memo: r.memo, memberId: r.memberId, date: `${y}-${pad2(m)}-${pad2(day)}`, isRecurring: true, recurringId: r.id, freq: r.frequency });
        }
      } else if (r.frequency === "yearly") {
        if (m === am && y >= ay) {
          virtual.push({ id: `rec_${r.id}_${mk}`, amount: r.amount, tag: r.tag, memo: r.memo, memberId: r.memberId, date: `${y}-${pad2(am)}-${pad2(ad)}`, isRecurring: true, recurringId: r.id, freq: r.frequency });
        }
      }
    });
    return [...actual, ...virtual];
  };

  const monthEntries = useMemo(() => getMonthEntries(viewMonth), [entries, recurring, viewMonth]);
  const prevMonthEntries = useMemo(() => getMonthEntries(shiftMonth(viewMonth, -1)), [entries, recurring, viewMonth]);

  const monthTotal = useMemo(() => monthEntries.reduce((s, e) => s + Number(e.amount), 0), [monthEntries]);
  const prevMonthTotal = useMemo(() => prevMonthEntries.reduce((s, e) => s + Number(e.amount), 0), [prevMonthEntries]);
  const pctChange = prevMonthTotal > 0 ? Math.round(((monthTotal - prevMonthTotal) / prevMonthTotal) * 100) : null;

  // タグを1つ選んでその前月比を見る
  const [trendTag, setTrendTag] = useState("");
  useEffect(() => { if (tags.length && !trendTag) setTrendTag(tags[0].name); }, [tags]);
  const tagTrend = useMemo(() => {
    if (!trendTag) return null;
    const cur = monthEntries.filter((e) => e.tag === trendTag).reduce((s, e) => s + Number(e.amount), 0);
    const prev = prevMonthEntries.filter((e) => e.tag === trendTag).reduce((s, e) => s + Number(e.amount), 0);
    const diff = cur - prev;
    const pct = prev > 0 ? Math.round((diff / prev) * 100) : (cur > 0 ? null : 0);
    return { cur, prev, diff, pct };
  }, [monthEntries, prevMonthEntries, trendTag]);

  const byTag = useMemo(() => {
    const map = {};
    monthEntries.forEach((e) => { map[e.tag] = (map[e.tag] || 0) + Number(e.amount); });
    return Object.entries(map).sort((a, b) => b[1] - a[1]);
  }, [monthEntries]);
  const maxTag = byTag.length ? byTag[0][1] : 1;

  const byMember = useMemo(() => {
    const map = {};
    monthEntries.forEach((e) => { map[e.memberId] = (map[e.memberId] || 0) + Number(e.amount); });
    return Object.entries(map).sort((a, b) => b[1] - a[1]);
  }, [monthEntries]);
  const maxMember = byMember.length ? byMember[0][1] : 1;

  const split = useMemo(() => {
    if (members.length !== 2) return null;
    const [m1, m2] = members;
    const s1 = monthEntries.filter((e) => e.memberId === m1.id).reduce((s, e) => s + Number(e.amount), 0);
    const s2 = monthEntries.filter((e) => e.memberId === m2.id).reduce((s, e) => s + Number(e.amount), 0);
    const total = s1 + s2;
    if (total === 0) return { even: true };
    const low = s1 <= s2 ? m1 : m2;
    const high = s1 <= s2 ? m2 : m1;
    const lowSum = Math.min(s1, s2);
    const amount = (total - lowSum) / 2;
    if (Math.round(amount) === 0) return { even: true };
    return { payer: low, receiver: high, amount };
  }, [members, monthEntries]);

  const grouped = useMemo(() => {
    const map = {};
    monthEntries.forEach((e) => { map[e.date] = map[e.date] || []; map[e.date].push(e); });
    return Object.entries(map).sort((a, b) => (a[0] < b[0] ? 1 : -1));
  }, [monthEntries]);

  const memberOf = (id) => members.find((m) => m.id === id);

  if (loading) {
    return <div style={{ background: C.paper, height: "100%", display: "flex", alignItems: "center", justifyContent: "center" }}>
      <p className="sans" style={{ color: C.inkSoft }}>読み込み中…</p>
    </div>;
  }

  const page = { flex: 1, minHeight: 0, display: "flex", flexDirection: "column" };
  const scrollArea = { flex: 1, minHeight: 0, overflowY: "auto" };

  return (
    <div style={{ background: C.paper, height: "100%", display: "flex", justifyContent: "center" }}>
      <div style={{ width: "100%", maxWidth: 448, height: "100%", display: "flex", flexDirection: "column" }}>

        <div style={{ flexShrink: 0, height: "calc(env(safe-area-inset-top, 0px) + 12px)", background: C.paper }} />

        {error && (
          <div className="sans" style={{ padding: "6px 16px", background: "#fff", borderBottom: `1px solid ${C.stamp}`, color: C.stamp, fontSize: 11 }}>{error}</div>
        )}

        {view === "home" && (
          <div style={page}>
            <div style={{ background: GRADIENT, padding: "16px 20px 14px", flexShrink: 0, borderRadius: "0 0 22px 22px" }}>
              <h1 className="serif" style={{ color: "#fff", fontSize: 17, margin: 0 }}>🍑 家計帳</h1>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 14, marginTop: 4 }}>
                <button onClick={() => setViewMonth((v) => shiftMonth(v, -1))} style={{ background: "none", padding: 2 }}><ChevLeft color="#fff" size={16} /></button>
                <span className="sans" style={{ color: "#fff", fontSize: 13 }}>{fmtMonthJp(viewMonth)}</span>
                <button onClick={() => setViewMonth((v) => shiftMonth(v, 1))} style={{ background: "none", padding: 2 }}><ChevRight color="#fff" size={16} /></button>
              </div>
              <div style={{ textAlign: "center", marginTop: 4 }}>
                <span className="sans" style={{ color: "#ffffffcc", fontSize: 10 }}>合計</span>
                <div style={{ display: "flex", alignItems: "baseline", justifyContent: "center", gap: 6 }}>
                  <div className="num" style={{ color: "#fff", fontSize: 26, fontWeight: 800, lineHeight: 1.2 }}>{fmtYen(monthTotal)}</div>
                  {pctChange !== null && (
                    <span className="num" style={{
                      fontSize: 10, fontWeight: 700, padding: "2px 6px", borderRadius: 999,
                      background: "rgba(255,255,255,0.25)", color: "#fff",
                    }}>{pctChange > 0 ? "▲" : pctChange < 0 ? "▼" : "―"} {Math.abs(pctChange)}% 先月比</span>
                  )}
                </div>
              </div>
            </div>

            {split && (
              <div className="sans" style={{ flexShrink: 0, margin: "8px 16px 0", padding: "8px 12px", background: "#fff", border: `1px solid ${C.line}`, borderRadius: 12, fontSize: 12, color: C.ink, display: "flex", alignItems: "center", gap: 6 }}>
                {split.even ? (
                  <span>🧮 今のところ割り勘の差はありません</span>
                ) : (
                  <React.Fragment>
                    <Stamp member={split.payer} size={20} />
                    <span style={{ flex: 1, textDecoration: isPaid ? "line-through" : "none", opacity: isPaid ? 0.5 : 1 }}>
                      {split.payer.name}が{split.receiver.name}に <span className="num" style={{ fontWeight: 700 }}>{fmtYen(split.amount)}</span> 払う
                    </span>
                    <button onClick={handlePaidTap} className="sans" style={{
                      flexShrink: 0, display: "flex", alignItems: "center", gap: 3, padding: "4px 8px", borderRadius: 999, fontSize: 10,
                      background: isPaid ? C.moss : confirmPaid ? "#F5D9A8" : C.paperDeep,
                      color: isPaid ? "#fff" : confirmPaid ? "#7A4E10" : C.inkSoft,
                      border: `1px solid ${isPaid ? C.moss : confirmPaid ? "#E0B060" : C.line}`,
                    }}>
                      <CheckIcon size={11} color={isPaid ? "#fff" : confirmPaid ? "#7A4E10" : C.inkSoft} />
                      {isPaid ? "支払い済み" : confirmPaid ? "もう一度タップ" : "未払い"}
                    </button>
                  </React.Fragment>
                )}
              </div>
            )}

            <div style={{ flexShrink: 0, margin: "8px 16px 0", padding: "8px 10px", background: "#fff", border: `1px solid ${C.line}`, borderRadius: 12 }}>
              <div style={{ display: "flex", gap: 5, overflowX: "auto", paddingBottom: 4 }}>
                {tags.map((tg) => (
                  <button key={tg.id} onClick={() => setTrendTag(tg.name)} className="sans" style={{
                    flexShrink: 0, borderRadius: 999, padding: "3px 10px", fontSize: 10,
                    border: `1px solid ${trendTag === tg.name ? C.ink : C.line}`,
                    background: trendTag === tg.name ? C.ink : C.paper, color: trendTag === tg.name ? "#fff" : C.inkSoft,
                  }}>{tg.name}</button>
                ))}
              </div>
              {tagTrend && (
                <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginTop: 4 }}>
                  <span className="sans" style={{ fontSize: 10, color: C.inkSoft }}>{trendTag}・今月 {fmtYen(tagTrend.cur)}</span>
                  <span className="num" style={{
                    fontSize: 11, fontWeight: 700,
                    color: tagTrend.diff > 0 ? C.stamp : tagTrend.diff < 0 ? C.moss : C.inkSoft,
                  }}>
                    {tagTrend.diff > 0 ? "▲" : tagTrend.diff < 0 ? "▼" : "―"} {fmtYen(Math.abs(tagTrend.diff))}
                    {tagTrend.pct !== null && ` (${tagTrend.pct > 0 ? "+" : ""}${tagTrend.pct}%)`} 先月比
                  </span>
                </div>
              )}
            </div>

            <div style={{ flexShrink: 0, display: "flex", gap: 10, margin: "8px 16px 0" }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div className="sans" style={{ fontSize: 10, color: C.inkSoft, marginBottom: 3 }}>タグ別</div>
                <div style={{ maxHeight: 86, overflowY: "auto" }}>
                {byTag.map(([t, sum]) => (
                  <div key={t} style={{ display: "flex", alignItems: "center", gap: 4, marginBottom: 2 }}>
                    <span className="sans" style={{ fontSize: 9, color: C.inkSoft, width: 36, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{t}</span>
                    <div style={{ flex: 1, height: 4, borderRadius: 999, background: C.paperDeep }}>
                      <div style={{ width: `${(sum / maxTag) * 100}%`, height: 4, borderRadius: 999, background: C.stamp, opacity: 0.75 }} />
                    </div>
                    <span className="num" style={{ fontSize: 9, color: C.ink }}>{fmtYen(sum)}</span>
                  </div>
                ))}
                {byTag.length === 0 && <div className="sans" style={{ fontSize: 10, color: C.inkSoft }}>記録なし</div>}
                </div>
              </div>
              <div style={{ flex: 1 }}>
                <div className="sans" style={{ fontSize: 10, color: C.inkSoft, marginBottom: 3 }}>人別</div>
                {byMember.map(([mid, sum]) => {
                  const m = memberOf(mid);
                  if (!m) return null;
                  return (
                    <div key={mid} style={{ display: "flex", alignItems: "center", gap: 4, marginBottom: 2 }}>
                      <span className="sans" style={{ fontSize: 9, color: C.inkSoft, width: 30, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{m.name}</span>
                      <div style={{ flex: 1, height: 4, borderRadius: 999, background: C.paperDeep }}>
                        <div style={{ width: `${(sum / maxMember) * 100}%`, height: 4, borderRadius: 999, background: m.color, opacity: 0.75 }} />
                      </div>
                      <span className="num" style={{ fontSize: 9, color: C.ink }}>{fmtYen(sum)}</span>
                    </div>
                  );
                })}
                {byMember.length === 0 && <div className="sans" style={{ fontSize: 10, color: C.inkSoft }}>記録なし</div>}
              </div>
            </div>

            <div style={{ ...scrollArea, margin: "8px 16px 8px" }}>
              {monthEntries.length === 0 ? (
                <div className="sans" style={{ textAlign: "center", padding: "24px 0", color: C.inkSoft, fontSize: 12, border: `1px dashed ${C.line}`, borderRadius: 10 }}>
                  この月の記録はまだありません。
                </div>
              ) : grouped.map(([d, list]) => (
                <div key={d} style={{ marginBottom: 8 }}>
                  <div className="sans" style={{ color: C.inkSoft, fontSize: 10, marginBottom: 3 }}>{fmtDateJp(d)}</div>
                  <div style={{ background: "#fff", borderRadius: 12, border: `1px solid ${C.line}` }}>
                    {list.map((e, i) => (
                      editEntryId === e.id ? (
                        <div key={e.id} className="sans" style={{ padding: "10px", borderBottom: i < list.length - 1 ? `1px solid ${C.line}` : "none", background: C.paper }}>
                          <div style={{ display: "flex", gap: 6, marginBottom: 6 }}>
                            <input type="number" inputMode="numeric" value={editAmount} onChange={(ev) => setEditAmount(ev.target.value)}
                              className="num" style={{ width: 90, padding: "5px 8px", fontSize: 13, color: C.ink, background: "#fff", border: `1px solid ${C.line}`, borderRadius: 8, outline: "none" }} />
                            <input type="date" value={editDate} onChange={(ev) => setEditDate(ev.target.value)}
                              className="sans" style={{ flex: 1, padding: "5px 8px", fontSize: 11, color: C.ink, background: "#fff", border: `1px solid ${C.line}`, borderRadius: 8, outline: "none" }} />
                          </div>
                          <div style={{ display: "flex", flexWrap: "nowrap", gap: 5, overflowX: "auto", marginBottom: 6, paddingBottom: 2 }}>
                            {tags.map((tg) => (
                              <button key={tg.id} onClick={() => setEditTag(tg.name)} style={{
                                flexShrink: 0, borderRadius: 999, padding: "4px 10px", fontSize: 10,
                                border: `1px solid ${editTag === tg.name ? C.ink : C.line}`,
                                background: editTag === tg.name ? C.ink : "#fff", color: editTag === tg.name ? "#fff" : C.inkSoft,
                              }}>{tg.name}</button>
                            ))}
                          </div>
                          <div style={{ display: "flex", gap: 6 }}>
                            <input value={editMemo} onChange={(ev) => setEditMemo(ev.target.value)} placeholder="メモ"
                              className="sans" style={{ flex: 1, padding: "5px 8px", fontSize: 11, color: C.ink, background: "#fff", border: `1px solid ${C.line}`, borderRadius: 8, outline: "none" }} />
                            <button onClick={() => saveEditEntry(e)} style={{ background: C.stamp, borderRadius: 8, padding: "0 10px", display: "flex", alignItems: "center" }} aria-label="保存"><CheckIcon size={14} color="#fff" /></button>
                            <button onClick={() => setEditEntryId(null)} style={{ background: C.paperDeep, borderRadius: 8, padding: "0 10px", display: "flex", alignItems: "center" }} aria-label="キャンセル"><XIcon size={14} color={C.inkSoft} /></button>
                          </div>
                        </div>
                      ) : (
                      <div key={e.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 10px", borderBottom: i < list.length - 1 ? `1px solid ${C.line}` : "none" }}>
                        <Stamp member={memberOf(e.memberId)} size={24} />
                        <div onClick={() => startEditEntry(e)} style={{ flex: 1, minWidth: 0 }}>
                          <div className="sans" style={{ color: C.ink, fontSize: 12, fontWeight: 500, display: "flex", alignItems: "center", gap: 3 }}>
                            {e.tag}
                            {e.isRecurring && <RepeatIcon size={11} color={C.moss} />}
                          </div>
                          <div className="sans" style={{ color: e.memo ? C.inkSoft : "#C9B8AC", fontSize: 10, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", fontStyle: e.memo ? "normal" : "italic" }}>
                            {e.memo || "メモなし"}
                          </div>
                        </div>
                        <div className="num" style={{ color: C.ink, fontSize: 13, fontWeight: 700 }}>{fmtYen(e.amount)}</div>
                        <button onClick={() => startEditEntry(e)} style={{ background: "none", display: "flex" }} aria-label="編集"><PencilIcon size={12} /></button>
                        <button onClick={() => removeEntry(e)} style={{ background: "none" }} aria-label="削除"><TrashIcon size={13} /></button>
                      </div>
                      )
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {view === "add" && (
          <div style={{ ...page, padding: "12px 16px", position: "relative" }}>
            {justSaved && (
              <div className="sans save-pop" style={{
                position: "absolute", top: "38%", left: "50%", transform: "translate(-50%,-50%)",
                zIndex: 10, background: C.stamp, color: "#fff", borderRadius: 999,
                padding: "10px 24px", display: "flex", alignItems: "center", justifyContent: "center",
                fontSize: 15, fontWeight: 700, boxShadow: "0 8px 20px rgba(255,146,112,0.5)", whiteSpace: "nowrap",
              }}>Saved</div>
            )}
            {(members.length === 0 || tags.length === 0) ? (
              <p className="sans" style={{ color: C.inkSoft, fontSize: 13 }}>
                {members.length === 0 && "先に「メンバー」タブから記録する人を追加してください。"}
                {members.length === 0 && tags.length === 0 && <br />}
                {tags.length === 0 && "先に「タグ」タブからタグを追加してください。"}
              </p>
            ) : (
              <React.Fragment>
                {/* 電卓 */}
                <div style={{ flexShrink: 0, background: "#fff", border: `1px solid ${C.line}`, borderRadius: 16, padding: 8 }}>
                  <div className="sans" style={{ fontSize: 10, color: C.inkSoft, textAlign: "right", minHeight: 12, overflow: "hidden", whiteSpace: "nowrap" }}>{exprPreview}</div>
                  <div className="num" style={{ fontSize: 26, fontWeight: 700, color: C.ink, textAlign: "right" }}>{fmtYen(liveTotal)}</div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 5, marginTop: 6 }}>
                    {["7","8","9"].map((d) => <CalcBtn key={d} onClick={() => pressDigit(d)}>{d}</CalcBtn>)}
                    <CalcBtn onClick={pressBackspace} style={{ background: C.paperDeep }}><BackspaceIcon size={14} /></CalcBtn>
                    {["4","5","6"].map((d) => <CalcBtn key={d} onClick={() => pressDigit(d)}>{d}</CalcBtn>)}
                    <CalcBtn onClick={resetCalc} style={{ background: C.paperDeep, color: C.stamp }}>C</CalcBtn>
                    {["1","2","3"].map((d) => <CalcBtn key={d} onClick={() => pressDigit(d)}>{d}</CalcBtn>)}
                    <CalcBtn onClick={() => pressOp("+")} style={{ background: C.ink, color: "#fff" }}>+</CalcBtn>
                    <CalcBtn onClick={() => pressDigit("0")}>0</CalcBtn>
                    <CalcBtn onClick={() => pressDigit("00")}>00</CalcBtn>
                    <CalcBtn onClick={pressEquals} style={{ background: C.stamp, color: "#fff" }}>=</CalcBtn>
                    <CalcBtn onClick={() => pressOp("-")} style={{ background: C.ink, color: "#fff" }}>−</CalcBtn>
                  </div>
                </div>

                <div style={{ flexShrink: 0, display: "flex", flexWrap: "nowrap", gap: 6, marginTop: 8, overflowX: "auto", paddingBottom: 2 }}>
                  {tags.map((t) => (
                    <button key={t.id} onClick={() => setTag(t.name)} className="sans" style={{
                      flexShrink: 0, borderRadius: 999, padding: "5px 12px", fontSize: 11,
                      border: `1px solid ${tag === t.name ? C.ink : C.line}`,
                      background: tag === t.name ? C.ink : "#fff", color: tag === t.name ? C.paper : C.inkSoft,
                    }}>{t.name}</button>
                  ))}
                </div>

                <input value={memo} onChange={(ev) => setMemo(ev.target.value)} placeholder="メモ(任意)"
                  className="sans" style={{ flexShrink: 0, width: "100%", marginTop: 8, padding: "7px 10px", outline: "none", fontSize: 12, color: C.ink, background: "#fff", border: `1px solid ${C.line}`, borderRadius: 12 }} />

                <div style={{ flexShrink: 0, display: "flex", gap: 6, marginTop: 8, alignItems: "center" }}>
                  <input type="date" value={date} onChange={(ev) => setDate(ev.target.value)}
                    className="sans" style={{ flex: 1, padding: "7px 8px", outline: "none", fontSize: 12, color: C.ink, background: "#fff", border: `1px solid ${C.line}`, borderRadius: 12 }} />
                  <button onClick={() => setIsRecurring((v) => !v)} className="sans" style={{
                    display: "flex", alignItems: "center", gap: 4, padding: "7px 10px", borderRadius: 12, fontSize: 11,
                    border: `1px solid ${isRecurring ? C.moss : C.line}`, background: isRecurring ? C.moss : "#fff", color: isRecurring ? "#fff" : C.inkSoft,
                  }}><RepeatIcon size={12} color={isRecurring ? "#fff" : C.inkSoft} />繰り返す</button>
                </div>
                {isRecurring && (
                  <div style={{ flexShrink: 0, display: "flex", gap: 6, marginTop: 6 }}>
                    {[["monthly", "毎月"], ["yearly", "毎年"]].map(([k, l]) => (
                      <button key={k} onClick={() => setFreq(k)} className="sans" style={{
                        flex: 1, padding: "6px 0", borderRadius: 12, fontSize: 11,
                        border: `1px solid ${freq === k ? C.ink : C.line}`, background: freq === k ? C.ink : "#fff", color: freq === k ? C.paper : C.inkSoft,
                      }}>{l}</button>
                    ))}
                  </div>
                )}

                <div style={{ flexShrink: 0, display: "flex", gap: 8, marginTop: 8 }}>
                  {members.map((m) => (
                    <button key={m.id} onClick={() => setMemberId(m.id)} style={{ background: "none", display: "flex", flexDirection: "column", alignItems: "center" }}>
                      <div style={{ opacity: memberId === m.id ? 1 : 0.4 }}><Stamp member={m} size={28} /></div>
                    </button>
                  ))}
                </div>

                <div style={{ flex: 1 }} />
                <button onClick={addEntry} disabled={!liveTotal || liveTotal <= 0 || !tag} className="sans" style={{
                  flexShrink: 0, width: "100%", padding: "11px", background: C.stamp, color: "#fff",
                  borderRadius: 12, fontWeight: 700, fontSize: 14, opacity: (!liveTotal || liveTotal <= 0 || !tag) ? 0.5 : 1,
                }}>記録する</button>
              </React.Fragment>
            )}
          </div>
        )}

        {view === "tags" && (
          <div style={{ ...page, padding: "14px 16px" }}>
            <h2 className="serif" style={{ color: C.ink, fontSize: 15, margin: "0 0 8px" }}>タグ</h2>
            <div style={{ ...scrollArea, display: "flex", flexDirection: "column", gap: 6 }}>
              {displayTags.map((t, i) => (
                <div key={t.id} className="sans" style={{
                  display: "flex", alignItems: "center", gap: 8, padding: "6px 8px 6px 4px", borderRadius: 12,
                  border: `1px solid ${C.line}`, background: "#fff", color: C.ink, fontSize: 12,
                  transform: dragId === t.id ? `translateY(${dragOffset}px) scale(1.02)` : "none",
                  boxShadow: dragId === t.id ? "0 6px 14px rgba(0,0,0,0.15)" : "none",
                  position: "relative", zIndex: dragId === t.id ? 2 : 1, transition: dragId === t.id ? "none" : "transform .15s ease",
                }}>
                  <button
                    onTouchStart={(ev) => handleDragStart(t, i, ev.touches[0].clientY)}
                    onTouchMove={(ev) => { ev.preventDefault(); handleDragMove(t, ev.touches[0].clientY); }}
                    onTouchEnd={handleDragEnd}
                    onMouseDown={(ev) => {
                      handleDragStart(t, i, ev.clientY);
                      const onMove = (mv) => handleDragMove(t, mv.clientY);
                      const onUp = () => { handleDragEnd(); window.removeEventListener("mousemove", onMove); window.removeEventListener("mouseup", onUp); };
                      window.addEventListener("mousemove", onMove);
                      window.addEventListener("mouseup", onUp);
                    }}
                    style={{ background: "none", padding: 6, display: "flex", touchAction: "none", cursor: "grab" }}
                    aria-label="並び替え"
                  >
                    <GripIcon size={15} color={C.inkSoft} />
                  </button>
                  <span style={{ flex: 1 }}>{t.name}</span>
                  <button onClick={() => removeTag(t.id)} style={{ background: "none", padding: 4, display: "flex" }} aria-label={`${t.name}を削除`}><XIcon size={13} /></button>
                </div>
              ))}
              {tags.length === 0 && <p className="sans" style={{ color: C.inkSoft, fontSize: 12 }}>まだタグがありません。</p>}
            </div>
            <div style={{ flexShrink: 0, padding: 10, background: "#fff", border: `1px solid ${C.line}`, borderRadius: 12, marginTop: 8 }}>
              <div style={{ display: "flex", gap: 8 }}>
                <input value={newTag} onChange={(ev) => setNewTag(ev.target.value)} onKeyDown={(ev) => ev.key === "Enter" && addTag()}
                  placeholder="例)食費" className="sans" style={{ flex: 1, padding: "7px 10px", outline: "none", fontSize: 12, color: C.ink, background: C.paper, border: `1px solid ${C.line}`, borderRadius: 6 }} />
                <button onClick={addTag} disabled={!newTag.trim() || tags.some((x) => x.name === newTag.trim())} className="sans" style={{ padding: "0 16px", background: C.ink, color: C.paper, borderRadius: 10, fontSize: 12, fontWeight: 500, opacity: (!newTag.trim() || tags.some((x) => x.name === newTag.trim())) ? 0.5 : 1 }}>追加</button>
              </div>
            </div>
          </div>
        )}

        {view === "members" && (
          <div style={{ ...page, padding: "14px 16px" }}>
            <h2 className="serif" style={{ color: C.ink, fontSize: 15, margin: "0 0 8px" }}>メンバー</h2>
            <div style={{ ...scrollArea, display: "flex", flexDirection: "column", gap: 6 }}>
              {members.map((m) => (
                <div key={m.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "7px 10px", background: "#fff", border: `1px solid ${C.line}`, borderRadius: 12 }}>
                  <Stamp member={m} size={28} />
                  <div className="sans" style={{ flex: 1, fontSize: 13, color: C.ink, fontWeight: 500 }}>{m.name}</div>
                  <button onClick={() => removeMember(m.id)} style={{ background: "none", display: "flex" }} aria-label="削除"><XIcon size={14} /></button>
                </div>
              ))}
              {members.length === 0 && <p className="sans" style={{ color: C.inkSoft, fontSize: 12 }}>まだメンバーがいません。</p>}
            </div>
            <div style={{ flexShrink: 0, padding: 10, background: "#fff", border: `1px solid ${C.line}`, borderRadius: 12, marginTop: 8 }}>
              <div style={{ display: "flex", gap: 8 }}>
                <input value={newName} onChange={(ev) => setNewName(ev.target.value)} onKeyDown={(ev) => ev.key === "Enter" && addMember()} placeholder="名前(例:たろう)"
                  className="sans" style={{ flex: 1, padding: "7px 10px", outline: "none", fontSize: 12, color: C.ink, background: C.paper, border: `1px solid ${C.line}`, borderRadius: 6 }} />
                <button onClick={addMember} disabled={!newName.trim()} className="sans" style={{
                  padding: "0 16px", background: C.ink, color: C.paper, borderRadius: 10, fontSize: 12, fontWeight: 500,
                  opacity: !newName.trim() ? 0.5 : 1,
                }}>追加</button>
              </div>
            </div>
          </div>
        )}

        <div style={{ flexShrink: 0 }}>
          <div style={{ display: "flex", borderTop: `1px solid ${C.line}`, background: "#fff" }}>
            {[
              { key: "add", label: "記録", Icon: PlusIcon },
              { key: "home", label: "帳簿", Icon: BookIcon },
              { key: "tags", label: "タグ", Icon: TagIcon },
              { key: "members", label: "メンバー", Icon: UsersIcon },
            ].map(({ key, label, Icon: I }) => (
              <button key={key} onClick={() => setView(key)} style={{ flex: 1, background: "none", display: "flex", flexDirection: "column", alignItems: "center", gap: 2, padding: "8px 0" }}>
                <I color={view === key ? C.stamp : C.inkSoft} size={17} />
                <span className="sans" style={{ fontSize: 9, color: view === key ? C.stamp : C.inkSoft }}>{label}</span>
              </button>
            ))}
          </div>
          <div style={{ height: "calc(env(safe-area-inset-bottom, 0px) + 16px)", background: C.paper }} />
        </div>
      </div>
    </div>
  );
}

function CalcBtn({ children, onClick, style }) {
  return (
    <button onClick={onClick} className="num" style={{
      height: 38, borderRadius: 12, background: "#FFE7D9", color: "#8A5A45", fontSize: 15, fontWeight: 700,
      display: "flex", alignItems: "center", justifyContent: "center", ...style,
    }}>{children}</button>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
